on:
  push:
    branches:
      - main
      - 'claude/**'  # Auto-build for all Claude branches
      - 'feature/**' # Auto-build for all feature branches
      - 'fix/**'     # Auto-build for all fix branches
  workflow_dispatch:

# Push to ghcr needs packages: write explicitly - the default GITHUB_TOKEN may
# be read-only. A repository other than the package's own one (the private
# copy) additionally needs Write in the package's "Manage Actions access".
permissions:
  contents: read
  packages: write

env:
  DOCKER_REGISTRY: ghcr.io
  API_BASE_URL: https://labgrader.markpolyak.ru/api/v1

jobs:
  build:
    name: Build frontend and backend images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_REGISTRY }}/markpolyak/lab_grader_${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-
      - name: Build docker image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: ${{ matrix.service }}.Dockerfile
          push: true
          build-args: |
            API_BASE_URL=${{ env.API_BASE_URL }}
