# Example schedule file: ONE course, ALL groups inside.
# Lives at schedules/<course_id>.yaml, referenced from courses/<course_id>.yaml
# via `course.schedule-file: <course_id>.yaml`.
#
# This file is the source of truth at runtime — ManualScheduleSource reads
# it on every request for any group in it. The "refresh" admin endpoint
# overwrites `groups.<id>.slots:` with data from GUAP for groups with
# `source: guap`, but never touches `corrections:`, `queue_settings:`,
# or any other teacher-edited field.

course-id: os-2026            # sanity check: must match the course's own id

groups:
  # ----- Group 4432 -----
  "4432":
    timezone: "UTC+3"
    source: guap                              # who originally produced these slots
    guap_group_id: "4432"                      # code on guap.ru/rasp, for the refresh button

    auto_open_minutes_before: 15              # open queue 15 min before slot start
    auto_close_minutes_after: 10              # close queue 10 min after slot end

    slots:
      - id: "mon-1"
        date: "2026-11-09"                     # one-off slot on a specific date
        start: "13:00"
        end: "14:30"
        labs: ["1", "2"]                      # only lab "1" or "2" can be defended here
        room: "301"
        subject: "Операционные системы"

      - id: "tue-1-odd"
        recurrence:
          day: "tuesday"
          week: "odd"                          # only odd ISO weeks (1, 3, 5, ...)
        start: "13:00"
        end: "14:30"
        labs: ["1", "2", "3"]

      - id: "thu-2"
        recurrence:
          day: "thursday"
          week: "all"                         # every week
        start: "15:00"
        end: "16:30"
        labs: ["1", "2", "3", "quiz"]

      - id: "extra-lab3"
        date: "2026-11-20"
        start: "17:00"
        end: "18:30"
        labs: ["3"]
        room: "305"
        note: "Доп. консультация перед дедлайном"

    corrections:
      - id: "corr-lab2-move"
        description: "Перенос ЛР2 на 17:00 (конференция)"
        date: "2026-11-09"
        remove_slots:
          - slot_id: "mon-1"
            labs: ["2"]                        # remove only lab "2" from slot "mon-1"
        add_slots:
          - id: "mon-1-lab2-moved"
            start: "17:00"
            end: "18:30"
            labs: ["2"]
            room: "301"

      - id: "corr-cancel-22nov"
        description: "Отмена пар 22.11 (день самоуправления)"
        date: "2026-11-22"
        remove_slots:
          - slot_id: "thu-2"                   # labs not specified → remove whole slot
        add_slots: []

    queue_settings:
      max_students_per_slot: 30
      allow_multiple_labs: true
      auto_requeue_on_no_show: false           # MVP: just drop on no_show
      all_lab_ids: ["1", "2", "3", "quiz"]

  # ----- Group 4433 (another group of the same course) -----
  "4433":
    timezone: "UTC+3"
    source: guap
    guap_group_id: "4433"

    auto_open_minutes_before: 15
    auto_close_minutes_after: 10

    slots:
      - id: "wed-1"
        recurrence:
          day: "wednesday"
          week: "all"
        start: "13:00"
        end: "14:30"
        labs: ["1", "2", "3"]
        room: "302"
        subject: "Операционные системы"

      - id: "fri-2"
        recurrence:
          day: "friday"
          week: "all"
        start: "15:00"
        end: "16:30"
        labs: ["1", "2", "3", "quiz"]
        room: "302"

    corrections: []

    queue_settings:
      max_students_per_slot: 25
      allow_multiple_labs: false
      auto_requeue_on_no_show: false
      all_lab_ids: ["1", "2", "3", "quiz"]
