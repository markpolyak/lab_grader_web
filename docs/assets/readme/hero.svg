<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Lab Grader · Defense Queue</title><desc id="desc">Очередь защиты лабораторных: допуск, посещение, приоритет от −1 и история.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1523"/><stop offset="1" stop-color="#15132f"/></linearGradient>
 <linearGradient id="edge" x2="1" y2="1"><stop stop-color="#c4fff1" stop-opacity=".7"/><stop offset=".42" stop-color="#e7faff" stop-opacity=".12"/><stop offset="1" stop-color="#c6b3ff" stop-opacity=".45"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#eafffa" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".025"/></linearGradient>
 <linearGradient id="accent" x2="1"><stop stop-color="#90f5d4"/><stop offset="1" stop-color="#bca7ff"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="52"/></filter>
 <clipPath id="clip"><rect width="1200" height="440" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)"><rect width="1200" height="440" fill="url(#bg)"/>
<g filter="url(#blur)" opacity=".42"><ellipse cx="220" cy="-35" rx="260" ry="120" fill="#0cae9a"/><ellipse cx="1040" cy="440" rx="260" ry="180" fill="#7156d7"/></g>
<rect x="20" y="20" width="1160" height="400" rx="22" fill="url(#glass)" stroke="url(#edge)"/><text x="54" y="70" fill="#a5b7cc" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="2">LAB GRADER WEB / QUEUE MODULE</text><text x="54" y="153" fill="#f5f8fc" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700">LAB GRADER</text><text x="54" y="212" fill="#a1f3da" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">DEFENSE QUEUE</text><text x="56" y="266" fill="#e8edf5" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Защита лабораторных. В понятном порядке.</text><text x="56" y="299" fill="#a8b9cc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Допуск → посещение → защита → история</text><rect x="56" y="342" width="145" height="34" rx="17" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".18"/><text x="71" y="364" fill="#cad7e8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">ПРИОРИТЕТ −1</text><rect x="213" y="342" width="112" height="34" rx="17" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".18"/><text x="228" y="364" fill="#cad7e8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">SQLITE</text><rect x="337" y="342" width="184" height="34" rx="17" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".18"/><text x="352" y="364" fill="#cad7e8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">ЖИВАЯ ОЧЕРЕДЬ</text><text x="782" y="71" fill="#a5b7cc" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="2">ПРИНЦИП ПРИОРИТЕТА</text><rect x="758" y="94" width="388" height="74" rx="14" fill="url(#glass)" stroke="url(#edge)"/><rect x="774" y="109" width="58" height="44" rx="10" fill="#a1f3da" fill-opacity=".13"/><text x="785" y="139" fill="#a1f3da" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">−1</text><text x="848" y="124" fill="#e8edf5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Просроченные работы</text><text x="848" y="147" fill="#a5b7cc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Общая нижняя граница</text><rect x="758" y="180" width="388" height="74" rx="14" fill="url(#glass)" stroke="url(#edge)"/><rect x="774" y="195" width="58" height="44" rx="10" fill="#eee6bc" fill-opacity=".13"/><text x="785" y="225" fill="#eee6bc" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">0</text><text x="848" y="210" fill="#e8edf5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Текущий дедлайн</text><text x="848" y="233" fill="#a5b7cc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Срок на этой неделе</text><rect x="758" y="266" width="388" height="74" rx="14" fill="url(#glass)" stroke="url(#edge)"/><rect x="774" y="281" width="58" height="44" rx="10" fill="#c5b6f7" fill-opacity=".13"/><text x="785" y="311" fill="#c5b6f7" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">+1…</text><text x="848" y="296" fill="#e8edf5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Будущие дедлайны</text><text x="848" y="319" fill="#a5b7cc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Чем ближе срок, тем раньше</text><text x="783" y="379" fill="#cbd4e8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">max(−1, дедлайн − неделя занятия)</text></g></svg>
