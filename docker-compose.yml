services:
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "8080:8080"

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - backend-logs:/app/logs
      - backend-queue-state:/app/queue_state
      - backend-schedule:/app/schedule
    env_file:
      - .env
    environment:
      # Локально запросы приходят напрямую, доверять X-Forwarded-For некому.
      # На сервере за обратным прокси - см. docs/DEPLOYMENT.md.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}

volumes:
  backend-logs:
  backend-queue-state:
  backend-schedule:
