services:
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "8080:80"

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      # Локально запросы приходят напрямую, доверять X-Forwarded-For некому.
      # На сервере за обратным прокси - см. docs/DEPLOYMENT.md.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
