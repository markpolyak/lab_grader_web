server {
    listen 8080;

    # Resolve the backend at request time so nginx can start before it is ready.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend backend:8000;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Frontend admin requests use /api/v1; backend routes have no prefix.
    location /ws {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location /api/v1/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }

    # Course logo paths must reach the backend unchanged.
    location /courses/logos/ {
        proxy_pass http://$backend;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
